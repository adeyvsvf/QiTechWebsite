<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - QiTech Solar Solutions</title>
    <meta name="description" content="QiTech Nigeria - Premier solar energy solutions launching soon. Clean energy, innovative technology, reliable power.">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="Images/favBez.png">
    <link rel="icon" type="image/png" sizes="16x16" href="Images/favBez.png">
    <link rel="apple-touch-icon" href="Images/favBez.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                        'display': ['DM Sans', 'Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#fefce8',
                            100: '#fef9c3',
                            200: '#fef08a',
                            300: '#fde047',
                            400: '#facc15',
                            500: '#eee324',
                            600: '#ca8a04',
                            700: '#a16207',
                            800: '#854d0e',
                            900: '#713f12',
                        },
                        dark: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 1.5s ease-out',
                        'slide-up': 'slideUp 1s ease-out',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(40px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    }
                }
            }
        }
    </script>

</head>
<body class="font-sans bg-dark-950 text-white dark overflow-x-hidden">

    <!-- Main Container -->
    <div class="relative min-h-screen flex items-center justify-center overflow-hidden">

        <!-- Animated Background -->
        <div class="absolute inset-0 bg-gradient-to-br from-dark-950 via-dark-900 to-dark-800"></div>
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_30%_20%,rgba(238,227,36,0.15),transparent_50%)]"></div>
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_70%_80%,rgba(238,227,36,0.1),transparent_50%)]"></div>

        <!-- Floating Elements -->
        <div class="absolute top-20 right-20 w-32 h-32 bg-primary-500/10 rounded-full blur-3xl animate-float"></div>
        <div class="absolute bottom-20 left-20 w-40 h-40 bg-primary-500/5 rounded-full blur-3xl animate-float" style="animation-delay: 2s;"></div>
        <div class="absolute top-1/2 left-1/3 w-24 h-24 bg-primary-500/10 rounded-full blur-2xl animate-pulse-slow"></div>

        <!-- Content -->
        <div class="relative z-10 container mx-auto px-6 lg:px-8 py-12">
            <div class="max-w-4xl mx-auto text-center">

                <!-- Logo -->
                <div class="mb-12 animate-fade-in">
                    <img src="Images/qids.png" alt="QiTech Solar Solutions" class="h-8 md:h-10 lg:h-12 w-auto mx-auto">
                </div>

                <!-- Main Heading -->
                <div class="mb-12 animate-slide-up" style="animation-delay: 0.2s;">
                    <h1 class="text-5xl md:text-6xl lg:text-7xl font-display font-bold leading-tight text-white">
                        <span class="block">Something Powerful</span>
                        <span class="block text-primary-500">is Coming</span>
                    </h1>
                </div>

                <!-- Social Links -->
                <div class="animate-slide-up" style="animation-delay: 1s;">
                    <p class="text-dark-300 mb-4">Follow us on Instagram</p>
                    <div class="flex justify-center">
                        <a href="https://www.instagram.com/qi_techltd?igsh=MWVwMHF0OTM1NWkybw==" target="_blank" rel="noopener noreferrer" class="w-12 h-12 bg-dark-800 border border-dark-700 rounded-xl flex items-center justify-center hover:bg-primary-500 hover:border-primary-500 hover:text-dark-900 transition-all duration-300" aria-label="Follow us on Instagram">
                            <i data-lucide="instagram" class="w-5 h-5"></i>
                        </a>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script>
        // Initialize Lucide icons
        document.addEventListener('DOMContentLoaded', function() {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        });

        window.addEventListener('load', function() {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        });

    </script>
</body>
</html>
